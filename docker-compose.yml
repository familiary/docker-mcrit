x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  mongodb:
    image: mongo:${MONGO_TAG:?}
    container_name: mongodb
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./storage/mongodb:/data/db
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
    - 127.0.0.1:27017-27019:27017-27019
  mcrit-server:
    image: mcrit:${MCRIT_TAG:?}
    build:
      context: ./docker/mcrit/
      args:
        MCRIT_TAG: "${MCRIT_TAG:?}"
        MCRIT_BRANCH: "${MCRIT_BRANCH:?}"
    container_name: mcrit-server
    init: true
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # locks down the API; MCRITweb needs the same value as its server token, see the README
      MCRIT_AUTH_TOKEN: ${MCRIT_AUTH_TOKEN:-}
    volumes:
      - ./config/:/opt/mcrit/mcrit/config/:ro
    entrypoint:
      - /entry_server.sh
    healthcheck:
      # any HTTP answer means the server is serving: an unrouted path stays out of the handlers,
      # which write a log document to MongoDB per request and 401 when MCRIT_AUTH_TOKEN is set
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
      - 127.0.0.1:8000:8000
  mcrit-worker:
    # same image as mcrit-server, which is the only service that builds it
    image: mcrit:${MCRIT_TAG:?}
    container_name: mcrit-worker
    init: true
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # the worker reaches MongoDB directly and does not authenticate against the API today; passed
      # so the two halves of the image cannot end up configured differently
      MCRIT_AUTH_TOKEN: ${MCRIT_AUTH_TOKEN:-}
    volumes:
      - ./config/:/opt/mcrit/mcrit/config/:ro
    entrypoint:
      - /entry_worker.sh
  mcritweb:
    image: mcritweb:${MCRITWEB_TAG:?}
    build:
      context: ./docker/mcritweb/
      args:
        MCRITWEB_BRANCH: "${MCRITWEB_BRANCH:?}"
        MCRITWEB_TAG: "${MCRITWEB_TAG:?}"
        MCRIT_TAG: "${MCRIT_TAG:?}"
    container_name: mcritweb
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      mcrit-server:
        condition: service_healthy
    volumes:
      # written by uid 10001 in the container: chown -R 10001:10001 storage/mcritweb
      - ./storage/mcritweb:/opt/mcritweb/instance
    entrypoint:
      - /entry_web_prod.sh
    ports: 
      - 127.0.0.1:5000:5000
  nginx:
    image: nginx:${NGINX_TAG:?}
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      mcritweb:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/uwsgi_params:/etc/nginx/uwsgi_params:ro
      - ./nginx/mcritweb_plain.conf:/etc/nginx/sites-enabled/mcritweb_plain.conf:ro
      # alternatively, if deployment with TLS is desired, copy ./nginx/ssl/*.pem.example to the
      # same names without the suffix and fill them in - the .pem files themselves are untracked
      # - ./nginx/mcritweb_ssl.conf:/etc/nginx/sites-enabled/mcritweb_ssl.conf:ro
      # - ./nginx/ssl:/opt/ssl_certificates:ro
      - ./logs/nginx:/var/log/nginx
    ports:
      - 0.0.0.0:80:80
      # only serves once the mcritweb_ssl.conf mount above is enabled
      - 0.0.0.0:443:443
