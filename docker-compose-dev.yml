services:
  mongodb:
    image: mongo:${MONGO_TAG:?}
    container_name: mongodb
    volumes:
      - ./storage/mongodb:/data/db
      - ./mongodb/mongod.conf:/etc/mongod.conf:ro
    command: ["mongod", "--config", "/etc/mongod.conf", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
    - 127.0.0.1:27017-27019:27017-27019
  mcrit-server:
    image: mcrit:${MCRIT_TAG:?}
    build:
      context: ./docker/mcrit/
      args:
        MCRIT_TAG: "${MCRIT_TAG:?}"
        MCRIT_BRANCH: "${MCRIT_BRANCH:?}"
    container_name: mcrit-server
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./repositories/mcrit:/opt/mcrit/
      # mounted over the package config rather than assembled from config.default like the
      # production file does: /opt/mcrit is a host checkout here, and assembling would write
      # into the developer's working tree
      - ./config/:/opt/mcrit/mcrit/config/:ro
    entrypoint:
      - /entry_server.sh
    healthcheck:
      # any HTTP answer means the server is serving: an unrouted path stays out of the handlers,
      # which write a log document to MongoDB per request and 401 when MCRIT_AUTH_TOKEN is set
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports: 
      - 127.0.0.1:8000:8000
  mcrit-worker:
    # same image as mcrit-server, which is the only service that builds it
    image: mcrit:${MCRIT_TAG:?}
    # no container_name, so that `--scale mcrit-worker=N` works here too
    init: true
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./repositories/mcrit:/opt/mcrit/
      # mounted over the package config rather than assembled from config.default like the
      # production file does: /opt/mcrit is a host checkout here, and assembling would write
      # into the developer's working tree
      - ./config/:/opt/mcrit/mcrit/config/:ro
    entrypoint:
      - /entry_worker.sh
  mcritweb:
    image: mcritweb:${MCRITWEB_TAG:?}
    build:
      context: ./docker/mcritweb/
      args:
        MCRITWEB_BRANCH: "${MCRITWEB_BRANCH:?}"
        MCRITWEB_TAG: "${MCRITWEB_TAG:?}"
        MCRIT_TAG: "${MCRIT_TAG:?}"
    container_name: mcritweb
    depends_on:
      mcrit-server:
        condition: service_healthy
    volumes:
      - ./repositories/mcritweb:/opt/mcritweb/
      - ./storage/mcritweb:/opt/mcritweb/instance
    entrypoint:
      - /entry_web_dev.sh
    ports: 
      - 127.0.0.1:5000:5000
