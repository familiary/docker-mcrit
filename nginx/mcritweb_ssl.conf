server {
    listen 443 ssl;
    # adjust server_name to your deployment if needed.
    server_name localhost;
    ssl_certificate /opt/ssl_certificates/fullchain.pem;
    ssl_certificate_key /opt/ssl_certificates/privkey.pem;

    # security
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 5m;

    # Mozilla "intermediate" suite. ECDHE only: no ssl_dhparam is configured, and without one
    # NGINX disables the DHE suites rather than falling back to built-in parameters.
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_protocols TLSv1.2 TLSv1.3;
    # config to enable HSTS(HTTP Strict Transport Security) https://developer.mozilla.org/en-US/docs/Security/HTTP_Strict_Transport_Security
    # to avoid ssl stripping https://en.wikipedia.org/wiki/SSL_stripping#SSL_stripping
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    client_max_body_size 500M;
    client_body_timeout 300s;
    uwsgi_read_timeout 300s;
    charset utf-8;

    if ($host != $server_name) {
        return 444;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location / {
        # https://flask.palletsprojects.com/en/1.0.x/deploying/wsgi-standalone/#proxy-setups
        proxy_pass         http://mcritweb:5000/;
        proxy_redirect     off;
        proxy_set_header   Host                 $host;
        proxy_set_header   X-Real-IP            $remote_addr;
        proxy_set_header   X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto    $scheme;
        client_max_body_size 500M;
    }
}