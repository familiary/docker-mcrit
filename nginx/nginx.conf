events { }
http {
  include mime.types;
  # resolver 127.0.0.1;
  include /etc/nginx/sites-enabled/*;
  client_max_body_size 500M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
