# Based on Workflow for main MCRIT and the workflow used in https://github.com/fkie-cad/cwe_checker
name: Build test

on: 
  push:
    branches:
      - main
  pull_request:
  schedule:
    # drift originates upstream, so waiting for a push here would not notice it
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:

  lint:
    name: Lint the deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the MCRIT Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/mcrit/Dockerfile
          config: .hadolint.yaml

      - name: Lint the MCRITweb Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/mcritweb/Dockerfile
          config: .hadolint.yaml

      - name: Validate the compose files
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose-dev.yml config -q

      - name: Shellcheck the helper and entry scripts
        run: |
          set -euo pipefail
          # the GitHub-hosted runners ship shellcheck, so nothing has to install it
          find . -name '*.sh' -print0 | xargs -0 shellcheck

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # .env is the single source of the pinned versions; compose reads it directly, so CI
      # reads it too rather than restating the tags here and letting the two drift.
      - name: Read the pinned versions from .env
        run: |
          set -euo pipefail
          grep -E '^[A-Z_]+=' .env >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the MCRIT image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/mcrit/
          load: true
          tags: mcrit:${{ env.MCRIT_TAG }}
          build-args: |
            MCRIT_TAG=${{ env.MCRIT_TAG }}
            MCRIT_BRANCH=${{ env.MCRIT_BRANCH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the MCRITweb image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker/mcritweb/
          load: true
          tags: mcritweb:${{ env.MCRITWEB_TAG }}
          build-args: |
            MCRITWEB_BRANCH=${{ env.MCRITWEB_BRANCH }}
            MCRITWEB_TAG=${{ env.MCRITWEB_TAG }}
            MCRIT_TAG=${{ env.MCRIT_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check functionality of the MCRIT image
        run: docker run --rm --entrypoint /entry_test.sh "mcrit:${MCRIT_TAG}"

  tuning-doc-mirror:
    name: docs/TUNING.md matches mcrit
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare against the canonical copy in mcrit
        run: |
          set -euo pipefail
          # docs/TUNING.md is a verbatim mirror; mcrit holds the canonical copy (see the note at
          # the top of the file). Compared against main rather than the pinned MCRIT_BRANCH,
          # because a release tag can predate a documentation fix - v1.6.2 does exactly that -
          # and the invariant worth enforcing is that the mirror equals the canonical copy.
          url="https://raw.githubusercontent.com/danielplohmann/mcrit/main/docs/TUNING.md"
          curl -fsSL "$url" -o /tmp/TUNING.canonical.md
          if ! diff -u /tmp/TUNING.canonical.md docs/TUNING.md; then
            echo
            echo "docs/TUNING.md has drifted from the canonical copy in mcrit."
            echo "Edit mcrit/docs/TUNING.md, then mirror it here:"
            echo "  curl -fsSL $url -o docs/TUNING.md"
            exit 1
          fi
          echo "docs/TUNING.md matches the canonical copy in mcrit."
